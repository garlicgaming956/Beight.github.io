<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #111111; /* Dark background, change to #ffffff for white */
            overflow: hidden;
        }
        img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <img src="son-son-meme.png" alt="Displayed Image">
</body>
</html>
